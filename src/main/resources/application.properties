spring.application.name=Zero_Waste

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_LOCAL_PORT:5432}/${POSTGRES_DATABASE:zero_waste}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase
spring.liquibase.enabled=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Security & External APIs
jwt.expiration=86400000
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXZlcnktc2VjdXJlLWRlZmF1bHQtand0LXNlY3JldC1rZXktZm9yLXRlc3RzLTIwMjY=}
dropbox.access-token=${DROPBOX_ACCESS_TOKEN:test-dropbox-token}
server.error.include-stacktrace=never
