<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7f1">
    <title>Zero Waste</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="page">
    <header class="site-header">
        <a class="brand" href="/" aria-label="Zero Waste home">
            <span class="brand-mark" aria-hidden="true">ZW</span>
            <span>zero waste</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="#">Explore</a>
            <a href="#">About</a>
            <a class="nav-action" href="#">Sign in</a>
        </nav>
    </header>

    <main>
        <section class="welcome" aria-labelledby="welcome-title">
            <p class="eyebrow">A little less waste, every day</p>
            <h1 id="welcome-title">Make room for a more thoughtful way to shop.</h1>
            <p class="welcome-copy">
                Discover simple ways to choose reusable, local, and low-waste essentials.
            </p>
        </section>

        <section
                id="content-container"
                class="content-container"
                aria-label="Page content"
                aria-live="polite">
        </section>
    </main>

    <footer class="site-footer">
        <span>Small choices make a difference.</span>
        <span>&copy; Zero Waste</span>
    </footer>
</div>
</body>
</html>
