name: Java CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        env:
          POSTGRES_HOST: localhost
          POSTGRES_LOCAL_PORT: 5432
          POSTGRES_DATABASE: zero_waste
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'dGhpcy1pcy1hLXRlc3Qtand0LXNlY3JldC1rZXktZm9yLWNpLTI1Ni1iaXQtc2FmZQ==' }}
          DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN || 'test-dropbox-token' }}
        run: mvn --batch-mode --update-snapshots verify